<!DOCTYPE html>
<html>


<head><script>
function fc1(){
var m=Number(document.f1.tx1.value);
var p1="";
const t1 = document.getElementById("d1");
for(var c=1;c<m;c++){var j=0;while(j<5)
{var x=Math.floor(Math.random()*19)-9;var y=Math.floor(Math.random()*19)-9;
var a=x+y;if((x<0)||(a<0)){j++;}
var b=Math.floor(Math.random()*1.2);if((x<0)&&(a<0)&&(b==0)){var r=x;x=y;y=r;}}
if(y<0){
p1+= " " + (`(${c}) ${x} ${y} = ${a}<br>`);
console.log(`(${c}) ${x} ${y} = ${a}\n`);
}else{
p1+= " "+(`(${c}) ${x} +${y} = ${a}<br>`);
console.log(`(${c}) ${x} +${y} = ${a}\n`);
}}
t1.innerHTML =p1;
}
</script></head>
<body>
<form name="f1" action="#">
<input type="text" name="tx1" value="">
<input type="button" value="GO" onclick="fc1()">
</form>
<div id="d1"></div>
</body>


</html>
